name: IndexNow

# Runs after GitHub Pages has finished publishing, then tells search engines which pages changed.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

jobs:
  submit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Submit changed pages to IndexNow
        env:
          AFTER: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          export BEFORE=$(git rev-parse "$AFTER~1" 2>/dev/null || echo "")
          python3 .github/indexnow.py
